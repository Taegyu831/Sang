<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e6a66" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="카메라로 얼굴의 비율을 재고, 전통 관상의 틀로 풀어 주는 졸업 전시 프로토타입" />
    <title>상(相) 역학원 · 관상측정</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preload" href="./fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="win" aria-label="관상측정">
      <div class="titlebar">
        <span class="ti"><i class="ico" aria-hidden="true">相</i>상 역학원 · 관상측정.exe</span>
        <span class="tb" aria-hidden="true"><b>_</b><b>□</b><b>×</b></span>
      </div>

      <div class="panel">
        <!-- 1. 시작 -->
        <section class="screen" id="emptyState">
          <div class="start">
            <h1 class="headline">얼굴부터<br />재어 보겠소</h1>
            <p class="lead">카메라 앞에 편하게 앉아 계시면,<br />전통 관상의 눈으로 얼굴을 풀어 드리오.</p>
            <button class="btn primary big-btn" id="cameraButton" type="button" disabled><span>준비 중</span></button>
            <p class="note permission-note"></p>
            <p class="note">얼굴 영상은 이 화면에서만 쓰고 저장하지 않아요.</p>
          </div>
        </section>

        <!-- 2. 측정 -->
        <section class="screen" id="scanScreen" hidden>
          <div class="scan">
            <div class="camera-frame" id="cameraFrame">
              <video id="camera" autoplay muted playsinline aria-label="카메라 영상"></video>
              <canvas id="overlay" aria-hidden="true"></canvas>
            </div>
            <p class="scan-msg" id="statusMessage" role="status">얼굴을 화면 가운데에 맞춰 주세요</p>
            <div class="bar"><i id="journeyProgress"></i></div>
            <button class="btn small" id="stopButton" type="button">그만하기</button>
          </div>
        </section>

        <!-- 3. 잠깐 -->
        <section class="screen" id="loadingScreen" hidden>
          <div class="loading">
            <p class="headline small-headline">관상을 풀어 보는 중<span class="dots" aria-hidden="true"></span></p>
            <div class="bar"><i id="loadBar"></i></div>
            <p class="lead" id="loadLine">관상서를 펼치는 중</p>
          </div>
        </section>

        <!-- 4. 풀이: 한 장씩 넘긴다 -->
        <section class="screen" id="resultView" aria-label="관상 풀이" hidden>
          <div class="pages" id="pages">
            <!-- 첫 장: 얼굴과 다섯 줄 요약 -->
            <article class="page" data-page="0">
              <div class="overview">
                <figure class="plate" id="resultFrontFigure" hidden>
                  <div class="face-plate">
                    <img id="resultFrontImage" alt="측정할 때의 얼굴" />
                    <svg id="resultFrontOverlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                  </div>
                  <div class="stamp" aria-hidden="true">相</div>
                </figure>
                <div class="overview-text">
                  <p class="headline small-headline">자, 말씀드리겠소.</p>
                  <ol class="summary-list" id="resultName"></ol>
                  <p class="hint">다음 장부터 하나씩 풀어 드리오 ▶</p>
                </div>
              </div>
            </article>

            <!-- 다섯 가지 풀이: 앱이 채운다 -->
            <div id="resultThemes" class="theme-pages"></div>

            <!-- 마지막 장 -->
            <article class="page" data-page="last">
              <div class="closing">
                <p class="headline small-headline">이상이오.</p>
                <div id="resultLinksWrap" hidden>
                  <p class="kicker">함께 보면</p>
                  <div class="links" id="resultLinks"></div>
                </div>
                <p class="closing-line" id="resultClosing"></p>
                <div class="closing-actions">
                  <button class="btn primary big-btn" id="restartButton" type="button">한 번 더 재기</button>
                  <button class="btn" id="homeButton" type="button">처음으로</button>
                </div>
              </div>
            </article>
          </div>

          <nav class="pager" aria-label="풀이 넘기기">
            <button class="btn" id="prevPage" type="button">◀ 이전</button>
            <div class="dots-nav" id="pageDots"></div>
            <button class="btn primary" id="nextPage" type="button">다음 ▶</button>
          </nav>
        </section>
      </div>
    </main>

    <script>
      if (window.location.protocol === "file:") {
        window.addEventListener("DOMContentLoaded", function () {
          var button = document.getElementById("cameraButton");
          var note = document.querySelector(".permission-note");
          if (button) {
            button.disabled = false;
            button.querySelector("span").textContent = "웹 버전으로 열기";
            button.addEventListener("click", function () {
              window.location.assign("https://taegyu831.github.io/Sang/");
            });
          }
          if (note) note.textContent = "이 파일은 웹 주소로 열어야 카메라가 켜져요.";
        });
      }
    </script>
    <script type="module" src="./app-v3.js"></script>
  </body>
</html>
