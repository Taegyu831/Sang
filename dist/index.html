<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ee" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="카메라로 얼굴의 비율을 재고, 전통 관상의 틀로 풀어 주는 졸업 전시 프로토타입" />
    <title>상(相) 역학원 · 관상측정</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preload" href="./fonts/PlexSansKR-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/PlexSansKR-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="상 역학원 관상측정">
      <div class="panel">
        <!-- 1. 시작 -->
        <section class="screen" id="emptyState">
          <div class="start">
            <span class="seal" aria-hidden="true">相</span>
            <h1 class="headline">얼굴부터<br /><em>재어</em> 보겠습니다</h1>
            <div class="master-row is-big" data-master="start" data-scale="5" data-pose="point">
              <div class="bubble"><p id="startSay">어서 오세요. 카메라 앞에 편히 앉으시면, 제가 얼굴을 하나하나 풀어 드리겠습니다.</p></div>
            </div>
            <button class="btn primary big-btn" id="cameraButton" type="button" disabled><span>준비 중</span></button>
            <p class="note permission-note"></p>
            <p class="note">얼굴 영상은 이 화면에서만 쓰고 저장하지 않아요.</p>
          </div>
        </section>

        <!-- 2. 측정 -->
        <section class="screen" id="scanScreen" hidden>
          <div class="scan">
            <div class="camera-frame" id="cameraFrame">
              <video id="camera" autoplay muted playsinline aria-label="카메라 영상"></video>
              <canvas id="overlay" aria-hidden="true"></canvas>
              <!-- 고개를 얼마나 '살짝' 돌릴지: 구간 세 칸, 지금 고개 위치, 따라 할 시범 -->
              <div class="turn-guide" id="turnGuide" aria-hidden="true" hidden>
                <div class="tg-track">
                  <span class="tg-zone" data-zone="left"><i></i><b>◀ 살짝</b></span>
                  <span class="tg-zone" data-zone="front"><i></i><b>정면</b></span>
                  <span class="tg-zone" data-zone="right"><i></i><b>살짝 ▶</b></span>
                  <span class="tg-ghost" id="tgGhost"></span>
                  <span class="tg-head" id="tgHead"></span>
                </div>
              </div>
            </div>
            <div class="master-row is-scan" data-master="scan" data-scale="3">
              <div class="bubble"><p class="scan-msg" id="statusMessage" role="status">얼굴을 화면 가운데에 맞춰 주세요</p></div>
            </div>
            <div class="bar"><i id="journeyProgress"></i></div>
            <div class="scan-actions">
              <button class="btn primary big-btn" id="toResultButton" type="button" hidden>풀이 보기 ▶</button>
              <button class="btn small" id="stopButton" type="button">그만하기</button>
            </div>
          </div>
        </section>

        <!-- 3. 잠깐 -->
        <section class="screen" id="loadingScreen" hidden>
          <div class="loading">
            <p class="headline small-headline">관상을 풀어 보는 중<span class="dots" aria-hidden="true"></span></p>
            <div class="bar"><i id="loadBar"></i></div>
            <div class="master-row" data-master="loading" data-scale="4">
              <div class="bubble"><p id="loadLine">관상서를 펼치는 중입니다</p></div>
            </div>
          </div>
        </section>

        <!-- 4. 풀이: 한 번에 아래로 내려 읽는다 -->
        <section class="screen" id="resultView" aria-label="관상 풀이" hidden>
          <div class="pages" id="pages">
            <!-- 맨 위: 얼굴과 가장 두드러진 세 곳 -->
            <article class="page" data-page="0">
              <div class="overview">
                <figure class="plate" id="resultFrontFigure" hidden>
                  <div class="face-plate">
                    <img id="resultFrontImage" alt="측정할 때의 얼굴" />
                    <svg id="resultFrontOverlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                  </div>
                  <div class="stamp" aria-hidden="true">相</div>
                </figure>
                <div class="overview-text">
                  <div class="master-row" data-master="result" data-scale="4" data-pose="point">
                    <div class="bubble"><p id="resultSay">자, 얼굴을 다 읽었습니다. 정리해 드리겠습니다.</p></div>
                  </div>
                  <p class="kicker">이 얼굴에서 가장 눈에 띄는 곳</p>
                  <ol class="top-list" id="topList"></ol>
                  <div class="synthesis" id="synthesis" aria-label="종합 풀이"></div>
                  <p class="hint">아래로 내려 부위별 풀이를 보세요 ▼</p>
                </div>
              </div>
            </article>

            <section class="page part-section">
              <h2 class="sec-head">가장 두드러진 세 곳</h2>
              <div class="part-cards" id="topCards"></div>
            </section>

            <section class="page part-section">
              <h2 class="sec-head">나머지 부위</h2>
              <div class="part-cards is-compact" id="restCards"></div>
            </section>

            <article class="page" data-page="last">
              <div class="closing">
                <span class="seal" aria-hidden="true">相</span>
                <div class="master-row" data-master="closing" data-scale="4">
                  <div class="bubble"><p id="closingSay">풀이는 여기까지입니다. 재미있게 보셨나요?</p></div>
                </div>
                <p class="closing-line" id="resultClosing"></p>
                <div class="closing-actions">
                  <button class="btn primary big-btn" id="restartButton" type="button">한 번 더 재기</button>
                  <button class="btn" id="homeButton" type="button">처음으로</button>
                </div>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>

    <script>
      if (window.location.protocol === "file:") {
        window.addEventListener("DOMContentLoaded", function () {
          var button = document.getElementById("cameraButton");
          var note = document.querySelector(".permission-note");
          if (button) {
            button.disabled = false;
            button.querySelector("span").textContent = "웹 버전으로 열기";
            button.addEventListener("click", function () {
              window.location.assign("https://taegyu831.github.io/Sang/");
            });
          }
          if (note) note.textContent = "이 파일은 웹 주소로 열어야 카메라가 켜져요.";
        });
      }
    </script>
    <script type="module" src="./app-v3.js"></script>
  </body>
</html>
