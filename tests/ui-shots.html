<!doctype html>
<meta charset="utf-8" />
<title>ui shots</title>
<style>body{margin:0;background:#333}iframe{border:0;width:100vw;height:100vh;display:block}</style>
<iframe id="app"></iframe>
<script>
// Local helper for screenshots of the reading without a camera (127.0.0.1 only).
//   ?slide=2         which page of the reading to show
//   ?w=390&h=844     phone size (headless Chrome will not open a window narrower than about 500px)
//   ?hover=N         point at the N-th part name (0 is the first) of the page, as a mouse would
//   ?scan=1          the measuring screen with a still picture instead of the camera
const q = new URLSearchParams(location.search);
const app = document.getElementById("app");
if (q.get("w")) { app.style.width = q.get("w") + "px"; app.style.height = (q.get("h") || 844) + "px"; }
app.src = (q.get("scan") || q.get("start")) ? "../dist/index.html?sim=1" : "../dist/index.html?preview=1&" + (q.get("v") ? "v=" + q.get("v") : "");
app.addEventListener("load", () => setTimeout(() => {
  const d = app.contentDocument;
  if (q.get("start")) {
    // The start screen as a visitor sees it once the camera is ready: gender and age picked
    // (the same "is-on" class the app sets), and the button enabled.
    d.querySelector('#genderPick [data-gender="female"]').classList.add("is-on");
    d.querySelector('#agePick [data-age="30"]').classList.add("is-on");
    const b = d.querySelector("#cameraButton");
    b.disabled = false; b.querySelector("span").textContent = "카메라 켜고 시작";
    return;
  }
  if (q.get("scan")) {
    d.querySelector("#emptyState").hidden = true;
    d.querySelector("#scanScreen").hidden = false;
    d.querySelector("#camera").poster = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#2a2a2a"/><ellipse cx="640" cy="360" rx="150" ry="200" fill="#8a7a6a"/></svg>');
    d.querySelector("#journeyProgress").style.setProperty("--p", "62%");
    // The turn guide mid-way: front done, left half done, head turning left.
    const g = d.querySelector("#turnGuide");
    g.hidden = false;
    g.querySelector('[data-zone="front"]').classList.add("is-done");
    g.querySelector('[data-zone="front"] i').style.width = "100%";
    g.querySelector('[data-zone="left"]').classList.add("is-next");
    g.querySelector('[data-zone="left"] i').style.width = "50%";
    d.querySelector("#tgGhost").style.setProperty("--to", "25%");
    d.querySelector("#tgHead").style.setProperty("--x", "32%");
    d.querySelector("#statusMessage").textContent = "이제 고개를 살짝 ◀ 쪽으로 돌려 보세요";
    return;
  }
  // The preview sometimes does not open the first time (the content loads late): wait for the
  // reading, and load the page again if it is not there after a while.
  let tries = 0;
  const open = () => {
    const dots = d.querySelectorAll(".slide-dot");
    const shown = !d.querySelector("#resultView").hidden && dots.length;
    if (!shown) {
      if (++tries % 25 === 0) { app.contentWindow.location.reload(); return; }
      return setTimeout(open, 200);
    }
    // ?slide=2 shows the third page of the reading (0 summary, 1 face shape, 2.. regions).
    dots[Number(q.get("slide") || 0)]?.click();
    if (q.get("hover") !== null) setTimeout(() => {
      const names = d.querySelectorAll(".slide.is-active .ink[data-part]");
      names[Number(q.get("hover"))]?.dispatchEvent(new app.contentWindow.PointerEvent("pointerover", { bubbles: true, pointerType: "mouse" }));
    }, 1800);
  };
  open();
}, 1500));
</script>
