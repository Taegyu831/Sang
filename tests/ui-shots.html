<!doctype html>
<meta charset="utf-8" />
<title>ui shots</title>
<style>body{margin:0;background:#333}iframe{border:0;width:100vw;height:100vh;display:block}</style>
<iframe id="app"></iframe>
<script>
// Local helper for screenshots of the reading without a camera (127.0.0.1 only).
//   ?scroll=900      how far down the reading to scroll
//   ?w=390&h=844     phone size (headless Chrome will not open a window narrower than about 500px)
//   ?scan=1          the measuring screen with a still picture instead of the camera
const q = new URLSearchParams(location.search);
const app = document.getElementById("app");
if (q.get("w")) { app.style.width = q.get("w") + "px"; app.style.height = (q.get("h") || 844) + "px"; }
app.src = q.get("scan") ? "../dist/index.html?sim=1" : "../dist/index.html?preview=1&" + (q.get("v") ? "v=" + q.get("v") : "");
app.addEventListener("load", () => setTimeout(() => {
  const d = app.contentDocument;
  if (q.get("scan")) {
    d.querySelector("#emptyState").hidden = true;
    d.querySelector("#scanScreen").hidden = false;
    d.querySelector("#camera").poster = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720" fill="#2a2a2a"/><ellipse cx="640" cy="360" rx="150" ry="200" fill="#8a7a6a"/></svg>');
    d.querySelector("#journeyProgress").style.setProperty("--p", "62%");
    // The turn guide mid-way: front done, left half done, head turning left.
    const g = d.querySelector("#turnGuide");
    g.hidden = false;
    g.querySelector('[data-zone="front"]').classList.add("is-done");
    g.querySelector('[data-zone="front"] i').style.width = "100%";
    g.querySelector('[data-zone="left"]').classList.add("is-next");
    g.querySelector('[data-zone="left"] i').style.width = "50%";
    d.querySelector("#tgGhost").style.setProperty("--to", "25%");
    d.querySelector("#tgHead").style.setProperty("--x", "32%");
    d.querySelector("#statusMessage").textContent = "이제 고개를 살짝 ◀ 쪽으로 돌려 보세요";
    return;
  }
  d.querySelector("#loadingScreen").click();
  // ?scroll=900 scrolls the reading down that many pixels.
  d.querySelector("#pages").style.scrollBehavior = "auto";
  d.querySelector("#pages").scrollTop = Number(q.get("scroll") || 0);
}, 1500));
</script>
