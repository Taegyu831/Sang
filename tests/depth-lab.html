<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>깊이 시험지 (코, 광대)</title>
<style>
  body { font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 16px; max-width: 980px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 22px 0 6px; }
  .dim { color: #999; } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button, select, input { font: inherit; background: #25252b; color: #eee; border: 1px solid #55555e; border-radius: 6px; padding: 5px 10px; }
  button.rec { background: #7a1f1f; border-color: #c44; }
  #stage { position: relative; width: 480px; max-width: 100%; }
  video { width: 100%; transform: scaleX(-1); border-radius: 8px; background: #000; }
  #bar { height: 10px; background: #2a2a30; border-radius: 5px; position: relative; margin: 6px 0; width: 480px; max-width: 100%; }
  #bar i { position: absolute; top: 0; bottom: 0; background: #4caf7a; border-radius: 5px; }
  #bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0; } th, td { padding: 3px 8px; text-align: right; border-bottom: 1px solid #2c2c33; }
  th:first-child, td:first-child { text-align: left; } th { color: #9a9aa3; font-weight: 500; }
  .good { color: #7fd48a; } .bad { color: #ff8a7a; } .warn { color: #f1c76b; }
  pre { background: #1b1b20; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>깊이 시험지: 고개를 돌려 코와 광대의 깊이를 재 봅니다</h1>
<div class="dim">전시용 앱과 따로 도는 시험 도구입니다. 정면에서 시작해 좌우로 천천히 두 번씩 돌립니다(각 20도쯤, 약 20초). 눈을 카메라 위치쯤에 두고, 머리만 돌리고 어깨와 몸은 움직이지 않습니다.</div>

<div class="row">
  <select id="camera"></select>
  <input id="label" placeholder="이름표 (이니셜 등, 예: A-맥북)" size="22" />
  <button id="start">카메라 켜기</button>
  <button id="rec" disabled>녹화 시작 (25초)</button>
  <button id="stop" disabled>멈추고 분석</button>
</div>
<div id="stage"><video id="video" playsinline muted></video></div>
<div id="bar"><i id="range"></i><b id="now"></b></div>
<div id="live" class="dim">대기 중</div>
<div id="guide" class="warn"></div>

<h2>결과</h2>
<div id="result" class="dim">녹화가 끝나면 여기에 표가 나옵니다.</div>
<div class="row">
  내 눈으로 본 코:
  <select id="rateNose"><option value="">(안 고름)</option><option>낮고 평평하다</option><option>보통</option><option>높고 나왔다</option></select>
  광대:
  <select id="rateCheek"><option value="">(안 고름)</option><option>평평하다</option><option>보통</option><option>나와 있다</option></select>
  <button id="export" disabled>JSON 저장</button>
</div>

<h2>저장한 기록 비교</h2>
<div class="dim">여러 번 또는 여러 사람의 JSON을 한꺼번에 고르면, 같은 사람의 반복이 일정한지와 사람 사이 차이를 표로 봅니다.</div>
<div class="row"><input id="files" type="file" accept=".json" multiple /></div>
<div id="compare"></div>

<script type="module">
import { getPoints } from "../dist/features.js";
import { estimatePose, poseFromMatrix } from "../dist/pose.js";
import { PAIRS, measureDepths, splitHalves } from "./depth-analysis.js";

const $ = (id) => document.getElementById(id);
const VENDOR = new URL("../dist/vendor/mediapipe/", import.meta.url).href;
const EXTRA = { cheekBumpLeft: 50, cheekBumpRight: 280 };
const REC_SECONDS = 25;
let landmarker = null, stream = null, running = false, recording = false, frames = [], startedAt = 0, lastVideoTime = -1, current = null;
let yawLo = 0, yawHi = 0, cameraInfo = {};

async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  $("camera").innerHTML = devices.map((d, i) => `<option value="${d.deviceId}">${d.label || "카메라 " + (i + 1)}</option>`).join("");
}
await navigator.mediaDevices.getUserMedia({ video: true }).then((s) => s.getTracks().forEach((t) => t.stop())).catch(() => {});
await listCameras();

async function loadModel() {
  const module = await import(`${VENDOR}vision_bundle.mjs`);
  const vision = await module.FilesetResolver.forVisionTasks(`${VENDOR}wasm`);
  const make = (delegate) => module.FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: `${VENDOR}face_landmarker.task`, delegate },
    runningMode: "VIDEO", numFaces: 1, outputFacialTransformationMatrixes: true,
  });
  try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }
}

$("start").onclick = async () => {
  $("start").disabled = true; $("live").textContent = "모델 불러오는 중";
  if (!landmarker) await loadModel();
  stream?.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { deviceId: { exact: $("camera").value }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  $("video").srcObject = stream; await $("video").play();
  const s = stream.getVideoTracks()[0].getSettings();
  cameraInfo = { label: stream.getVideoTracks()[0].label, width: $("video").videoWidth, height: $("video").videoHeight, fps: s.frameRate ?? null };
  running = true; $("rec").disabled = false; $("start").disabled = false; $("start").textContent = "카메라 다시 켜기";
  $("live").textContent = `카메라 ${cameraInfo.label} ${cameraInfo.width}x${cameraInfo.height}`;
  loop();
};

function loop() {
  if (!running) return;
  const video = $("video");
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = landmarker.detectForVideo(video, performance.now());
    const lm = result.faceLandmarks?.[0];
    if (lm) onFace(lm, result.facialTransformationMatrixes?.[0]?.data, video.videoWidth, video.videoHeight);
    else current = null;
  }
  requestAnimationFrame(loop);
}

function onFace(lm, matrix, w, h) {
  const pts = getPoints(lm, w, h);
  for (const [name, index] of Object.entries(EXTRA)) pts[name] = { x: lm[index].x * w, y: lm[index].y * h, z: lm[index].z * w };
  const pose = estimatePose(pts);
  const m = poseFromMatrix(matrix);
  current = { yaw: pose.yaw, pitch: pose.pitch };
  const t = (performance.now() - startedAt) / 1000;
  if (recording) {
    frames.push({ t, yaw: pose.yaw, pitch: pose.pitch, roll: pose.roll, matrixYaw: m?.yaw ?? null, pts });
    yawLo = Math.min(yawLo, pose.yaw); yawHi = Math.max(yawHi, pose.yaw);
    const left = Math.max(0, REC_SECONDS - t);
    $("guide").textContent = guideAt(t);
    $("live").textContent = `녹화 ${left.toFixed(0)}초 남음, 프레임 ${frames.length}, 고개 각도 ${pose.yaw.toFixed(0)}도 (범위 ${yawLo.toFixed(0)} ~ ${yawHi.toFixed(0)}), 끄덕임 ${pose.pitch.toFixed(0)}도`;
    if (t >= REC_SECONDS) finish();
  } else {
    $("live").textContent = `고개 각도 ${pose.yaw.toFixed(0)}도, 끄덕임 ${pose.pitch.toFixed(0)}도`;
  }
  $("now").style.left = `${50 + (pose.yaw / 60) * 100}%`;
  $("range").style.left = `${50 + (yawLo / 60) * 100}%`;
  $("range").style.width = `${((yawHi - yawLo) / 60) * 100}%`;
}

const STEPS = [[0, "정면을 봅니다"], [3, "천천히 왼쪽으로 20도쯤"], [8, "천천히 오른쪽으로 20도쯤"], [13, "다시 왼쪽으로"], [18, "다시 오른쪽으로"], [23, "정면으로 돌아옵니다"]];
const guideAt = (t) => [...STEPS].reverse().find(([s]) => t >= s)[1];

$("rec").onclick = () => {
  frames = []; yawLo = 0; yawHi = 0; startedAt = performance.now(); recording = true;
  $("rec").disabled = true; $("stop").disabled = false; $("export").disabled = true;
};
$("stop").onclick = () => finish();

function fmt(v, digits = 1) { return v === null || v === undefined ? "-" : v.toFixed(digits); }

function finish() {
  if (!recording) return;
  recording = false; $("rec").disabled = false; $("stop").disabled = true; $("guide").textContent = "";
  const all = measureDepths(frames);
  const [h1, h2] = splitHalves(frames);
  $("result").innerHTML = table(all, h1, h2) + `<div class="dim">프레임 ${frames.length}장 중 쓸 수 있는 것 ${all.frames}장, 각도 범위 ${fmt(all.yawMin, 0)} ~ ${fmt(all.yawMax, 0)}도.</div>`;
  $("export").disabled = frames.length === 0;
}

function table(all, h1, h2) {
  if (!all.scale) return `<div class="bad">고개를 돌린 범위가 모자랍니다(좌우 합쳐 15도 이상 필요). 다시 녹화해 주세요.</div>`;
  const rows = PAIRS.map((p) => {
    const a = all.pairs[p.id], x = h1.pairs[p.id]?.parallax ?? null, y = h2.pairs[p.id]?.parallax ?? null;
    const diff = x !== null && y !== null ? Math.abs(x - y) : null;
    const cls = diff === null ? "" : diff < 3 ? "good" : diff < 7 ? "warn" : "bad";
    return `<tr><td>${p.label}</td><td>${fmt(a.parallax)}</td><td>${fmt(x)}</td><td>${fmt(y)}</td><td class="${cls}">${fmt(diff)}</td><td>${fmt(a.modelZ)}</td><td>${fmt(a.fitRms)}</td></tr>`;
  }).join("");
  return `<table><tr><th>부위 (값은 눈 바깥 폭의 %)</th><th>돌림 시차</th><th>앞 절반</th><th>뒤 절반</th><th>절반 차이</th><th>모델 z값</th><th>맞춤 오차</th></tr>${rows}</table>
  <div class="dim">절반 차이가 작을수록 같은 값이 반복해서 나온다는 뜻입니다(3 미만 초록). 모델 z값은 지금 앱이 쓰는 깊이로, 비교용입니다.</div>`;
}

function round(v) { return Math.round(v * 100) / 100; }
$("export").onclick = () => {
  const out = {
    version: 1, label: $("label").value, savedAt: new Date().toISOString(), camera: cameraInfo,
    rating: { nose: $("rateNose").value, cheek: $("rateCheek").value },
    frames: frames.map((f) => ({ t: round(f.t), yaw: round(f.yaw), pitch: round(f.pitch), roll: round(f.roll), matrixYaw: f.matrixYaw === null ? null : round(f.matrixYaw), pts: Object.fromEntries(Object.entries(f.pts).map(([k, p]) => [k, [round(p.x), round(p.y), round(p.z)]])) })),
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" }));
  a.download = `depth-${($("label").value || "noname").replace(/[^\w가-힣-]/g, "_")}-${Date.now()}.json`;
  a.click();
};

$("files").onchange = async () => {
  const rows = [];
  for (const file of $("files").files) {
    const data = JSON.parse(await file.text());
    const fr = data.frames.map((f) => ({ ...f, pts: Object.fromEntries(Object.entries(f.pts).map(([k, v]) => [k, { x: v[0], y: v[1], z: v[2] }])) }));
    const all = measureDepths(fr), [h1, h2] = splitHalves(fr);
    rows.push({ label: data.label, camera: data.camera?.label ?? "", rating: data.rating ?? {}, all, h1, h2 });
  }
  const head = PAIRS.map((p) => `<th>${p.label.replace(/가 .*|이 .*/, "")}</th>`).join("");
  const body = rows.map((r) => `<tr><td>${r.label || "(이름표 없음)"}<br><span class="dim">${r.camera}</span></td><td>${r.rating.nose ?? ""}<br>${r.rating.cheek ?? ""}</td>${PAIRS.map((p) => {
    const v = r.all.pairs[p.id]?.parallax ?? null, a = r.h1.pairs[p.id]?.parallax ?? null, b = r.h2.pairs[p.id]?.parallax ?? null;
    return `<td>${fmt(v)}<br><span class="dim">${fmt(a)} / ${fmt(b)}</span></td>`;
  }).join("")}</tr>`).join("");
  $("compare").innerHTML = `<table><tr><th>기록</th><th>내 평가 (코/광대)</th>${head}</tr>${body}</table><div class="dim">각 칸: 전체 값, 아래 작은 글씨는 앞 절반 / 뒤 절반.</div>`;
};
</script>
</body>
</html>
