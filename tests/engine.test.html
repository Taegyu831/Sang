<!doctype html>
<meta charset="utf-8" />
<title>engine tests</title>
<pre id="out">RUNNING</pre>
<script>
// A crash must not look like a test that is still running.
for (const type of ["error", "unhandledrejection"]) window.addEventListener(type, (e) => { document.getElementById("out").textContent = `CRASHED ${e.message ?? e.reason?.stack ?? e.reason}`; });
</script>
<script type="module">
import { estimatePose, frontalizePoints, canonicalPoints } from "../dist/pose.js";
import { computeFrontFeatures } from "../dist/features.js";
import { CALIBRATION } from "../dist/calibration.js";
import { classifyAxes, classifySanjeong, classifyOgan, classifyOak } from "../dist/reading.js";
import { StableCapture, weightedMedian } from "../dist/capture.js";
import { interpret, evaluateTheme, buildTone } from "../dist/interpret.js";
import { findHairline, hairThirds } from "../dist/hair.js";
import { readParts } from "../dist/parts.js";
import { applyPoseResidual, POSE_RESIDUAL } from "../dist/residual.js";
import { mergeItems, composeStory } from "../dist/story.js";
import { extrasOf } from "../dist/extras.js";
import { classifyOhaeng, ohaengLines, FORMS } from "../dist/ohaeng.js";
import { ageLines, AGE_STAGES } from "../dist/age.js";
import { judgePairs, pairLines, PAIR_RULES } from "../dist/pairs.js";
import { judgeSanjeong, sanjeongText, sanjeongParts, STOP_RULES } from "../dist/sanjeong.js";
import { buildRecord } from "../dist/collect.js";
import { portraitPrompt, partnerOf, featureWords, fallbackPath } from "../dist/portrait.js";

const lines = [];
let failed = 0;
const check = (name, ok, detail = "") => { if (!ok) failed += 1; lines.push(`${ok ? "PASS" : "FAIL"} ${name}${detail ? "  " + detail : ""}`); };
const near = (a, b, tol) => Math.abs(a - b) <= tol;

const content = await (await fetch("../dist/content.json")).json();

// ---------- content file ----------
{
  const raw = JSON.stringify(content);
  check("content has no em dash or en dash", !/[—–]/.test(raw));
  check("five themes", content.themes.length === 5);
  let ok = true;
  const problems = [];
  for (const theme of content.themes) {
    for (const s of ["pos", "neg", "neutral"]) if (!theme.states[s]?.label || !theme.states[s]?.reading) { ok = false; problems.push(`${theme.id}.${s}`); }
    for (const s of ["pos", "neg"]) if (!theme.states[s]?.soft) { ok = false; problems.push(`${theme.id}.${s}.soft`); }
    for (const f of theme.features) {
      if (!CALIBRATION[f.key]) { ok = false; problems.push(`calibration ${f.key}`); }
      if (!content.factTemplates[f.key]) { ok = false; problems.push(`fact ${f.key}`); }
    }
  }
  check("every theme has labels, texts, calibration and fact templates", ok, problems.join(", "));
  const ids = new Set(content.themes.map((t) => t.id));
  check("links point at real themes", content.links.every((l) => l.when.every(([id, d]) => ids.has(id) && ["pos", "neg"].includes(d))));
}

// ---------- features on the canonical face ----------
const rad = (d) => (d * Math.PI) / 180;
const yawR = (p, a) => ({ x: p.x * Math.cos(a) - p.z * Math.sin(a), y: p.y, z: p.x * Math.sin(a) + p.z * Math.cos(a) });
const pitchR = (p, a) => ({ x: p.x, y: p.y * Math.cos(a) + p.z * Math.sin(a), z: -p.y * Math.sin(a) + p.z * Math.cos(a) });
const rollR = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a), z: p.z });
const canonical = canonicalPoints(14);
function pose3(points, yaw, pitch, roll, noise = 0, rng = Math.random) {
  const out = {};
  for (const [k, p] of Object.entries(points)) {
    const q = rollR(pitchR(yawR(p, rad(yaw)), rad(pitch)), rad(roll));
    out[k] = { x: q.x + 640 + (rng() - 0.5) * noise, y: q.y + 360 + (rng() - 0.5) * noise, z: q.z - 40 + (rng() - 0.5) * noise * 2 };
  }
  return out;
}
const truth = computeFrontFeatures(canonical);
const CALIBRATION_CENTERS = () => Object.fromEntries(Object.entries(CALIBRATION).map(([k, c]) => [k, c.center]));
const featureKeys = Object.keys(CALIBRATION).filter((k) => k in truth);
// The five-theme and three-frame engines (no longer on the visitor screen) are
// tested against the canonical face as the average, as they were designed.
// The live calibration now centres most ratios on real people instead.
const CANON = Object.fromEntries(Object.entries(CALIBRATION).map(([k, c]) => [k, { ...c, scale: c.captureScale ?? c.scale, center: k === "symmetry" || !Number.isFinite(truth[k]) ? 93 : truth[k] }]));

check("canonical thirds are within one step of the measured people", ["upperThird", "middleThird", "lowerThird"].every((k) => Math.abs(truth[k] - CALIBRATION[k].center) < CALIBRATION[k].scale),
  `${truth.upperThird.toFixed(1)}/${truth.middleThird.toFixed(1)}/${truth.lowerThird.toFixed(1)}`);
{
  let worst = 0;
  let worstKey = "";
  for (const key of featureKeys) {
    if (key === "symmetry" || CALIBRATION[key].from === "people") continue;
    const z = Math.abs(truth[key] - CALIBRATION[key].center) / CALIBRATION[key].scale;
    if (z > worst) { worst = z; worstKey = key; }
  }
  check("canonical face sits at the center of every ratio still calibrated on it", worst < 0.12, `worst ${worstKey} ${worst.toFixed(3)} steps`);
}

// full pipeline: rotate, frontalize, measure
for (const [yaw, pitch, roll] of [[22, 0, 0], [-24, 12, 0], [0, -18, 0], [15, 15, 6], [-20, -10, -8]]) {
  const rotated = pose3(canonical, yaw, pitch, roll);
  const fixed = computeFrontFeatures(frontalizePoints(rotated, estimatePose(rotated)));
  const raw = computeFrontFeatures(rotated);
  const stepErr = (f) => Math.max(...featureKeys.filter((k) => !["symmetry", "eyeTilt", "mouthLift"].includes(k)).map((k) => Math.abs(f[k] - truth[k]) / (CALIBRATION[k].captureScale ?? CALIBRATION[k].scale)));
  check(`pose ${yaw}/${pitch}/${roll}: corrected within 0.05 steps, raw is off`, stepErr(fixed) < 0.05 && stepErr(raw) > 0.2, `corrected ${stepErr(fixed).toFixed(3)} raw ${stepErr(raw).toFixed(2)} steps`);
  check(`pose ${yaw}/${pitch}/${roll}: eye tilt and mouth lift survive head tilt`, near(fixed.eyeTilt, truth.eyeTilt, 0.5) && near(fixed.mouthLift, truth.mouthLift, 0.3), `eyeTilt ${fixed.eyeTilt.toFixed(2)} vs ${truth.eyeTilt.toFixed(2)}, raw ${raw.eyeTilt.toFixed(2)}`);
}

// ---------- frames ----------
{
  const avg = classifyAxes(truth, undefined, CANON);
  check("average face: 삼정 balance, 오안 even", avg.axes.sanjeong.key === "balance" && avg.axes.ogan.key === "even", avg.signature);
  check("long upper third", classifySanjeong({ ...truth, upperThird: 33, middleThird: 28.5, lowerThird: 38.5 }, undefined, CANON).key === "upper");
  check("long middle third", classifySanjeong({ ...truth, upperThird: 26, middleThird: 36, lowerThird: 38 }, undefined, CANON).key === "middle");
  check("long lower third", classifySanjeong({ ...truth, upperThird: 25, middleThird: 28, lowerThird: 47 }, undefined, CANON).key === "lower");
  const tiers = ["light", "moderate", "clear"].map((_, i) => classifySanjeong({ ...truth, upperThird: 28.3 + [2.6, 4, 5.8][i], middleThird: 30.3, lowerThird: 41.4 - [2.6, 4, 5.8][i] }, undefined, CANON).tier);
  check("삼정 intensity tiers rise with the lead", tiers.join() === "light,moderate,clear", tiers.join());
  check("open eyes", classifyOgan({ ...truth, openMeasure: 1.5 }, undefined, CANON).key === "open");
  check("focused eyes", classifyOgan({ ...truth, openMeasure: 1.15 }, undefined, CANON).key === "focused");
  check("wide face and jaw: structure", classifyOak({ ...truth, jawCheek: 84, faceRatio: 93 }, undefined, CANON).key === "structure");
  check("narrow face and jaw: soft", classifyOak({ ...truth, jawCheek: 71, faceRatio: 80 }, undefined, CANON).key === "soft");
  const edge = classifySanjeong({ ...truth, upperThird: 28.3 + 0.8 * 3.0 + 0.05, middleThird: 30.3 - 1, lowerThird: 41.4 - 1.5 }, undefined, CANON);
  check("boundary flagged as near", edge.near === true, `margin ${edge.margin.toFixed(2)}`);
}

// ---------- themes ----------
{
  const avg = interpret(truth, content, CANON);
  check("average face reads balanced on all five themes", avg.themes.every((t) => t.state === "neutral"), avg.themes.map((t) => t.state).join());
  check("no cross links for an average face", avg.links.length === 0);

  const strong = interpret({ ...truth, lowerThird: 47, jawCheek: 84, philtrumLower: 23 }, content, CANON);
  const per = strong.themes.find((t) => t.id === "persistence");
  check("three ratios agree: persistence reads strongly", per.state === "pos" && !per.soft && per.supports === 3, `pull ${per.pull.toFixed(2)} supports ${per.supports}`);

  const weak = interpret({ ...truth, lowerThird: 46.5 }, content, CANON).themes.find((t) => t.id === "persistence");
  check("one ratio alone reads as a soft tendency", weak.state === "pos" && weak.soft === true && weak.supports === 1, `pull ${weak.pull.toFixed(2)} supports ${weak.supports}`);
  check("soft tendency uses the soft sentence", weak.reading.includes("약한 경향"));

  const outlier = interpret({ ...truth, lowerThird: 80 }, content, CANON).themes.find((t) => t.id === "persistence");
  check("one extreme ratio cannot make a strong reading", outlier.soft === true);

  const mixed = interpret({ ...truth, lowerThird: 47, jawCheek: 84, philtrumLower: 23, mouthNose: 2.1, mouthLift: 3.0 }, content, CANON);
  check("persistence and expression both positive picks the matching link", mixed.links.length >= 1 && mixed.links[0].themes.join() === "persistence,expression", mixed.links.map((l) => l.themes.join("+")).join(" | "));
  check("every theme always has a sentence", interpret({ ...truth, upperThird: 20 }, content, CANON).themes.every((t) => t.reading.length > 10));
  check("rows carry fact text with numbers", per.rows.every((r) => /\d/.test(r.fact)));

  const tone = buildTone({ ...truth, eyeTilt: 6, mouthLift: -2 }, content.tone, CANON);
  check("tone combines eye and mouth", tone.eye === "up" && tone.mouth === "down" && tone.text.includes("눈꼬리") && tone.text.includes("입꼬리"));
}

// ---------- continuous capture ----------
{
  // A face away from every decision line: wider jaw, longer lower part.
  const variant = canonicalPoints(14);
  variant.jawLeft.x *= 1.14;
  variant.jawRight.x *= 1.14;
  variant.chin.y *= 1.06;
  const variantTruth = computeFrontFeatures(variant);
  let seed = 11;
  const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const good = { pose: { yaw: 0, pitch: 0, roll: 0 }, blend: {}, faceFill: 0.5, centerOffset: 0.02 };
  const cap = new StableCapture();
  check("accepts a clean frontal frame", cap.assess(good).ok);
  check("rejects a smile", cap.assess({ ...good, blend: { mouthSmileLeft: 0.6, mouthSmileRight: 0.6 } }).reason === "smile");
  check("rejects an open mouth", cap.assess({ ...good, blend: { jawOpen: 0.4 } }).reason === "mouth-open");
  check("ignores a blink without scolding", cap.assess({ ...good, blend: { eyeBlinkLeft: 0.9, eyeBlinkRight: 0.9 } }).reason === "blink");
  check("rejects a large turn", cap.assess({ ...good, pose: { yaw: 40, pitch: 0, roll: 0 } }).reason === "yaw");
  check("rejects head too far up", cap.assess({ ...good, pose: { yaw: 0, pitch: 30, roll: 0 } }).reason === "pitch-up");
  check("rejects a tiny face", cap.assess({ ...good, faceFill: 0.1 }).reason === "far");
  check("a turned head counts less than a frontal one", cap.assess({ ...good, pose: { yaw: 20, pitch: 0, roll: 0 } }).weight < cap.assess(good).weight);
  {
    // 60 frames on the left read 10, 5 on the right read 14, 10 in front read 12:
    // the left side must not drown out the right side.
    const g = new StableCapture();
    const put = (n, yaw, v) => { for (let i = 0; i < n; i += 1) g.add({ x: v }, 1, { yaw, pitch: 0 }); };
    put(60, 15, 10); put(5, -15, 14); put(10, 0, 12);
    const est = g.estimate().x;
    check("both sides count the same however long one was held", Math.abs(est - 12) < 0.01, `estimate ${est.toFixed(2)} (plain median would be 10)`);
  }
  {
    // Iris ruler: a face with a 1.17 cm iris must read its real width at any turn.
    const withIris = canonicalPoints(14);
    const half = 0.585 * 14;
    const ec = (o, i) => ({ x: (withIris[o].x + withIris[i].x) / 2, y: (withIris[o].y + withIris[i].y) / 2, z: (withIris[o].z + withIris[i].z) / 2 });
    const l = ec("eyeLeftOuter", "eyeLeftInner"), r = ec("eyeRightOuter", "eyeRightInner");
    Object.assign(withIris, {
      irisLeftA: { ...l, x: l.x - half }, irisLeftB: { ...l, x: l.x + half },
      irisRightA: { ...r, x: r.x - half }, irisRightB: { ...r, x: r.x + half },
    });
    const widthCm = Math.abs(withIris.faceLeft.x - withIris.faceRight.x) / 14;
    const errors = [-24, -12, 0, 12, 24].map((yaw) => {
      const rotated = pose3(withIris, yaw, 0, 0);
      const pose = estimatePose(rotated);
      const mm = computeFrontFeatures(frontalizePoints(rotated, pose)).faceWidthMm;
      return Math.abs(mm / 10 - widthCm) / widthCm;
    });
    check("real face width from the iris ruler holds at every turn", Math.max(...errors) < 0.04, `worst error ${(Math.max(...errors) * 100).toFixed(1)}%, width ${widthCm.toFixed(1)} cm`);
  }
  {
    // Hairline from a mask: 100x100, hair above y=30 (forehead 30..60), 5 columns.
    const W = 100, H = 100;
    const clear = new Uint8Array(W * H);
    for (let y = 0; y < 30; y += 1) for (let x = 20; x < 80; x += 1) clear[y * W + x] = 1;
    const probe = { xs: [40, 45, 50, 55, 60], y: 60, reach: 50 };
    const a = findHairline(clear, W, H, probe);
    check("hairline is found above a clear forehead", a.status === "found" && Math.abs(a.y - 29) <= 1, JSON.stringify(a));
    const fringe = clear.slice();
    for (let y = 30; y < 66; y += 1) for (let x = 20; x < 80; x += 1) fringe[y * W + x] = 1;
    check("a fringe over the forehead is reported as covered", findHairline(fringe, W, H, probe).status === "covered");
    check("no hair at all reads as none", findHairline(new Uint8Array(W * H), W, H, probe).status === "none");
    const raw = { meshTop: { y: 60 }, glabella: { y: 90 } };
    const t = hairThirds(raw, { upperThird: 28, middleThird: 30, lowerThird: 42 }, 29);
    check("hairline thirds lengthen the top third and sum to 100", t && t.upperThirdHair > 28 && Math.abs(t.upperThirdHair + t.middleThirdHair + t.lowerThirdHair - 100) < 1e-9, t ? t.upperThirdHair.toFixed(1) : "null");
    check("a hairline below the mesh top is rejected", hairThirds(raw, { upperThird: 28, middleThird: 30, lowerThird: 42 }, 70) === null);
    const partsContent = await (await fetch("../dist/parts.json")).json();
    const withHair = readParts({ ...CALIBRATION_CENTERS(), upperThird: NaN, upperThirdHair: 38, middleThirdHair: 28, lowerThirdHair: 34 }, partsContent).all.find((p) => p.id === "thirds");
    check("the thirds card reads the hairline value when it is there", withHair && withHair.key === "upperThirdHair" && withHair.dir === "high" && /머리선/.test(withHair.mine), withHair ? `${withHair.key} ${withHair.dir} | ${withHair.mine}` : "no card");
  }
  check("weighted median ignores outliers", weightedMedian([[1, 1], [1.1, 1], [0.9, 1], [50, 1], [1.05, 1]]) < 1.2);

  function sweep(kind) {
    const c = new StableCapture();
    let frames = 0;
    while (!c.isDone(CALIBRATION) && frames < 900) {
      const t = frames / 20;
      const yaw = kind === "turn" ? 24 * Math.sin(t) : 8 * Math.sin(t * 0.7);
      const pitch = kind === "turn" ? 6 * Math.sin(t * 1.3) : 17 * Math.sin(t);
      const roll = 6 * Math.sin(t * 0.5);
      const smiling = frames % 17 === 0;
      const rotated = pose3(variant, yaw, pitch, roll, 1.2, rng);
      const pose = estimatePose(rotated);
      const verdict = c.assess({ pose, blend: smiling ? { mouthSmileLeft: 0.7, mouthSmileRight: 0.7 } : {}, faceFill: 0.5, centerOffset: 0.03 });
      if (verdict.ok) c.add(computeFrontFeatures(frontalizePoints(rotated, pose)), verdict.weight, pose);
      frames += 1;
    }
    return { c, frames };
  }
  const a = sweep("turn");
  const b = sweep("nod");
  const sa = a.c.snapshot(CALIBRATION);
  const sb = b.c.snapshot(CALIBRATION);
  check("sweeping left and right finishes by itself", a.c.isDone(CALIBRATION), `${a.frames} frames, stability ${sa.stability.toFixed(2)}`);
  check("nodding up and down finishes by itself", b.c.isDone(CALIBRATION), `${b.frames} frames, stability ${sb.stability.toFixed(2)}`);
  check("a left-right sweep covers front and both sides", a.c.nextZone === null, JSON.stringify(a.c.snapshot(CALIBRATION).zones));
  {
    const g = new StableCapture();
    const add = (yaw, n) => { for (let i = 0; i < n; i += 1) g.add({ noseWidth: 25 }, 1, { yaw, pitch: 0, roll: 0 }); };
    add(0, 60);
    check("front only: asks for the left turn next", g.nextZone === "left" && !g.isDone(CALIBRATION));
    add(15, 12);
    check("after the left turn: asks for the right", g.nextZone === "right");
    add(-15, 12);
    check("all three covered: nothing left to ask", g.nextZone === null);
    const h = new StableCapture();
    for (let i = 0; i < 80; i += 1) h.add({ noseWidth: 25 }, 1, { yaw: 0, pitch: 0, roll: 0 }, i * 250);
    check("someone who never turns still finishes after the time limit", h.zoneTimedOut && h.isDone(CALIBRATION));
  }
  const stepGap = (x, y) => Math.max(...["upperThird", "middleThird", "lowerThird", "openMeasure", "noseWidth", "mouthNose", "jawCheek", "faceRatio"].map((k) => Math.abs(x.values[k] - y.values[k]) / CALIBRATION[k].scale));
  check("two different head movements give the same ratios", stepGap(sa, sb) < 0.2, `largest gap ${stepGap(sa, sb).toFixed(3)} steps`);
  const toTruth = Math.max(...["upperThird", "middleThird", "lowerThird", "openMeasure", "noseWidth", "mouthNose", "jawCheek", "faceRatio"].map((k) => Math.abs(sa.values[k] - variantTruth[k]) / CALIBRATION[k].scale));
  check("pooled ratios stay close to the straight-on truth", toTruth < 0.2, `${toTruth.toFixed(3)} steps`);
  const ra = interpret(sa.values, content, CANON);
  const rb = interpret(sb.values, content, CANON);
  check("variant face reads as a wide jaw", ra.frames.axes.oak.key === "structure" && !ra.frames.axes.oak.near, `${ra.frames.signature}`);
  const settled = (r, o) => r.themes.every((x, i) => x.near || o.themes[i].near || x.state === o.themes[i].state);
  check("same face, same readings after both movements, except themes flagged as near a boundary",
    ra.frames.signature === rb.frames.signature && settled(ra, rb),
    `${ra.frames.signature} A:${ra.themes.map((x) => x.state + (x.near ? "*" : "")).join(" ")} B:${rb.themes.map((x) => x.state + (x.near ? "*" : "")).join(" ")}`);
  check("themes far from a boundary are identical", ra.themes.filter((x, i) => !x.near && !rb.themes[i].near).length >= 4);
  check("snapshot reports the angles covered", sa.coverage.yaw[1] - sa.coverage.yaw[0] > 20 && sb.coverage.pitch[1] - sb.coverage.pitch[0] > 15);

  {
    const c = new StableCapture();
    for (let i = 0; i < 30; i += 1) c.add({ x: 1 }, 1, { yaw: 0, pitch: 4 + (i % 3), roll: -2 }, i * 30, 0.45);
    const ctx = c.captureContext();
    check("capture context gives the mean up/down angle, tilt and face height", Math.abs(ctx.capturePitchMean - 5) < 0.2 && Math.abs(ctx.captureRollAbs - 2) < 1e-9 && Math.abs(ctx.captureFill - 0.45) < 1e-9 && ctx.capturePitchSd > 0, JSON.stringify(ctx));
    check("capture context is empty before any frame", Object.keys(new StableCapture().captureContext()).length === 0);
  }
}

{
  const edgeFace = classifyAxes(truth, undefined, CANON);
  check("a face exactly on a boundary is flagged as near", edgeFace.nearAxes.length >= 1, edgeFace.nearAxes.join());
}

// ---------- leftover head-angle correction ----------
{
  const same = applyPoseResidual(truth, { yaw: 0, pitch: 0, roll: 0 });
  check("no change at a straight-on pose", featureKeys.every((k) => same[k] === truth[k]));
  const nod = applyPoseResidual(truth, { yaw: 0, pitch: 20, roll: 0 });
  check("looking up 20 degrees moves lower third down and jaw ratio down", nod.lowerThird < truth.lowerThird - 2 && nod.jawCheek < truth.jawCheek - 3, `lower ${nod.lowerThird.toFixed(2)} jaw ${nod.jawCheek.toFixed(2)}`);
  const sum = (v) => v.upperThird + v.middleThird + v.lowerThird;
  for (const pose of [{ yaw: 0, pitch: 20 }, { yaw: 26, pitch: -15 }, { yaw: -20, pitch: 10 }]) {
    check(`thirds still add up to 100 at yaw ${pose.yaw} pitch ${pose.pitch}`, near(sum(applyPoseResidual(truth, pose)), sum(truth), 1e-6));
  }
  const far = applyPoseResidual(truth, { yaw: 80, pitch: 80 });
  const edge = applyPoseResidual(truth, { yaw: 30, pitch: 25 });
  check("never extrapolates beyond the fitted range", featureKeys.every((k) => far[k] === edge[k]));
  check("keeps keys it does not know about", applyPoseResidual({ ...truth, extra: 5 }, { yaw: 10, pitch: 10 }).extra === 5);
  check("every residual key is a calibrated ratio", Object.keys(POSE_RESIDUAL).every((k) => CALIBRATION[k]));
}

{
  // The kind of person must not pile up on a few kinds (story.js AXIS_BASE).
  const partsContent = await (await fetch("../dist/parts.json")).json();
  let seed = 5;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const first = {};
  const N = 800;
  for (let i = 0; i < N; i++) {
    const v = {};
    for (const [k, c] of Object.entries(CALIBRATION)) v[k] = c.center + c.scale * gauss();
    // the brow line sits about 8.6 points above the glabella and the nose tip 5.45 above the nose bottom (canonical face): see story.js AXIS_BASE
    v.stopMiddle = v.middleThird + 3.15 + 0.8 * gauss();
    v.stopLower = v.lowerThird + 5.45;
    const parts = readParts(v, partsContent);
    const lead = composeStory(parts.all, null, extrasOf(v, parts.all)).poles[0] ?? "even";
    first[lead] = (first[lead] ?? 0) + 1;
  }
  const kinds = ["drive+", "drive-", "social+", "social-", "feel+", "feel-", "steady+", "steady-"];
  const top = Math.max(...kinds.map((k) => (first[k] ?? 0) / N));
  const low = Math.min(...kinds.map((k) => (first[k] ?? 0) / N));
  check("no kind of person takes more than 20% of random faces", top <= 0.2, `top ${(top * 100).toFixed(1)}%`);
  check("every kind of person shows up in at least 5%", low >= 0.05, `lowest ${(low * 100).toFixed(1)}%`);
}

{
  // 삼정 as the old text cuts it (sanjeong.js, features.js stopFeatures)
  const canon = computeFrontFeatures(canonicalPoints(14));
  const sum = canon.stopUpper + canon.stopMiddle + canon.stopLower;
  check("the three zones (停) add up to 100", near(sum, 100, 0.01), `sum ${sum.toFixed(3)}`);
  check("middle over lower zone on the canonical face at the nose tip is 0.7", canon.stopMidLow > 0.65 && canon.stopMidLow < 0.8, `ratio ${canon.stopMidLow.toFixed(3)}`);
  check("the nose bottom cut gives a longer middle zone, kept for comparison", Number.isFinite(canon.stopMidLowBase) && canon.stopMidLowBase > canon.stopMidLow);
  const canonJudge = judgeSanjeong(canon);
  check("the canonical face reads as even with the stand-in centre", canonJudge && canonJudge.state === "even", `gap ${canonJudge?.gap.toFixed(3)}`);
  const cut = (middle, lower) => judgeSanjeong({ stopMiddle: middle, stopLower: lower });
  check("zones at the balanced reference read as even", cut(34.6, 45.4).state === "even" && cut(36, 44).state === "even");
  check("a clearly longer lower zone is told", cut(28, 52).state === "lowerLong" && cut(28, 52).gap < 0);
  check("a clearly longer middle zone is told", cut(40, 40).state === "middleLong" && cut(40, 40).gap > 0);
  const edge = STOP_RULES.evenWithin;
  const at = (gap) => judgeSanjeong({ stopMiddle: 100 * (1 + (STOP_RULES.center + gap) / 2), stopLower: 100 * (1 - (STOP_RULES.center + gap) / 2) });
  check("the band is symmetric around the reference", at(edge * 0.95).state === "even" && at(-edge * 0.95).state === "even" && at(edge * 1.1).state === "middleLong" && at(-edge * 1.1).state === "lowerLong");
  check("no judgement without the zone values", judgeSanjeong({}) === null && judgeSanjeong({ stopMiddle: NaN, stopLower: 40 }) === null);
  check("an equal face is told by a sentence, not a part", sanjeongParts(cut(34.6, 45.4)).length === 0 && /삼정의 균형/.test(sanjeongText(cut(34.6, 45.4))));
  const longPart = sanjeongParts(cut(28, 52))[0];
  check("a long zone becomes one part the story can fold in", longPart && longPart.id === "thirds" && longPart.key === "lowerThird" && longPart.dir === "high" && longPart.z >= 1);
  check("no dash in the 삼정 sentences", !/[\u2014\u2013]/.test(["even", "middleLong", "lowerLong"].map((state) => sanjeongText({ state })).join(""))); 
  const partsContent = await (await fetch("../dist/parts.json")).json();
  const skew = { ...Object.fromEntries(Object.entries(CALIBRATION).map(([k, c]) => [k, c.center])), lowerThird: CALIBRATION.lowerThird.center + 3 * CALIBRATION.lowerThird.scale, upperThird: CALIBRATION.upperThird.center };
  const thirdsCard = readParts(skew, partsContent).all.find((c) => c.id === "thirds");
  check("the thirds card no longer reads the middle and lower zone", !thirdsCard || thirdsCard.key === "upperThird", `key ${thirdsCard?.key}`);
  const even = { ...Object.fromEntries(Object.entries(CALIBRATION).map(([k, c]) => [k, c.center])), stopMiddle: 34.6, stopLower: 45.4 };
  const evenParts = readParts(even, partsContent);
  const story = composeStory(evenParts.all, null, extrasOf(even, evenParts.all));
  check("the first page tells the 삼정 frame before the parts", story.pages[0].body.some((line) => line.includes("삼정의 균형")));
  const longer = { ...even, stopMiddle: 28, stopLower: 52 };
  const longerParts = readParts(longer, partsContent);
  const longStory = composeStory(longerParts.all, null, extrasOf(longer, longerParts.all));
  check("an unequal face says which zone is long", longStory.pages[0].body.some((line) => line.includes("하정이 길면")));
}

{
  // 형 (오행형) and 지금의 나이 (ohaeng.js, age.js)
  const mid = Object.fromEntries(Object.entries(CALIBRATION).map(([k, c]) => [k, c.center]));
  const face = (o) => ({ ...mid, ...o });
  const C = CALIBRATION;
  check("a long face with a wide forehead and narrow jaw is 목형", classifyOhaeng(face({ faceRatio: C.faceRatio.center - 4 * C.faceRatio.scale, foreheadFace: 90, jawCheek: 72 }), C).id === "wood");
  check("a jaw wider than the forehead is 화형", classifyOhaeng(face({ foreheadFace: 82, jawCheek: 82, faceRatio: C.faceRatio.center }), C).id === "fire");
  check("wide forehead and wide jaw is 금형", classifyOhaeng(face({ foreheadFace: 91, jawCheek: 90 }), C).id === "metal");
  check("a wide face with a round chin is 수형", classifyOhaeng(face({ faceRatio: C.faceRatio.center + 4 * C.faceRatio.scale, chinWidth: C.chinWidth.center - 3 * C.chinWidth.scale, foreheadFace: 84, jawCheek: 79 }), C).id === "water");
  check("an even face is 토형", classifyOhaeng(face({}), C).id === "earth");
  check("no form without the width values", classifyOhaeng({}, C) === null);
  let seed = 11;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
  const share = {};
  for (let i = 0; i < 2000; i++) {
    const v = {};
    for (const k of ["faceRatio", "jawCheek", "foreheadFace", "chinWidth"]) v[k] = C[k].center + C[k].scale * gauss();
    const f = classifyOhaeng(v, C).id;
    share[f] = (share[f] ?? 0) + 1;
  }
  const shares = Object.values(share).map((n) => n / 2000);
  check("random faces give all five forms, none over 35% or under 8%", Object.keys(share).length === 5 && Math.max(...shares) <= 0.35 && Math.min(...shares) >= 0.08, JSON.stringify(share));
  const lines = ohaengLines(classifyOhaeng(face({ foreheadFace: 91, jawCheek: 90 }), C));
  check("the form sentence names the form and has no dash", /금형/.test(lines.join("")) && !/[\u2014\u2013]/.test(lines.join("")));
  check("every form has a look and a trait", Object.values(FORMS).every((f) => f.look && f.trait));

  const partsContent = await (await fetch("../dist/parts.json")).json();
  const all = readParts(face({ browLength: C.browLength.center + 3 * C.browLength.scale }), partsContent).all;
  const lines30 = ageLines(all, 30);
  check("the 30s are told from the brows and eyes", /눈썹과 눈/.test(lines30[0]) && lines30.length >= 2, lines30[1]);
  check("every age group has places and part cards", [20, 30, 40, 50].every((a) => AGE_STAGES[a].places && AGE_STAGES[a].ids.every((id) => partsContent.cards.some((c) => c.id === id))));
  check("the part name takes the right particle", /눈 사이는/.test(ageLines(readParts(face({ eyeGap: C.eyeGap.center + 3 * C.eyeGap.scale }), partsContent).all, 30).join("")) && !/사이은/.test(lines30.join("")));
  check("no age lines without an age group", ageLines(all, null).length === 0);
  const flat = ageLines(readParts(face({}), partsContent).all, 40);
  check("a face with nothing standing out in the 40s is told as steady", flat.length === 2 && /무난하게/.test(flat[1]));
  const v = face({ foreheadFace: 91, jawCheek: 90 });
  const ps = readParts(v, partsContent);
  const story = composeStory(ps.all, { name: "각진형", text: "각진형입니다. 둘째 문장입니다." }, extrasOf(v, ps.all, 20));
  check("the story opens with the form, not the plain shape sentence", story.pages[0].body[0].includes("금형") && !story.pages[0].body.some((l) => l.includes("각진형")));
  check("the 시기 page begins with the decade reading", story.pages[3].body[0].includes("20대"));
  const noForm = composeStory(ps.all, { name: "각진형", text: "각진형입니다. 둘째 문장입니다." }, { lines: [], size: null, stop: null, frame: [] });
  check("without a form the plain shape sentence is kept", noForm.pages[0].body[0].includes("각진형"));
}

{
  // 예외 (pairs.js): the most mismatched pair
  const C = CALIBRATION;
  const mid = Object.fromEntries(Object.entries(C).map(([k, c]) => [k, c.center]));
  const face = (o) => ({ ...mid, foreheadFace: 85.71, jawCheek: 80.4, cheekAsym: 3.0, ...o });
  const canonAsym = computeFrontFeatures(canonicalPoints(14)).cheekAsym;
  check("the canonical face has even cheekbone sides", canonAsym >= 0 && canonAsym < 1, `cheekAsym ${canonAsym?.toFixed(2)}`);
  check("an average face has even pairs", judgePairs(face({}), C).kind === "balanced");
  const wide = judgePairs(face({ foreheadFace: 92, jawCheek: 76 }), C);
  check("a wide forehead over a narrow jaw is the 福德宮 pair, told as late", wide.kind === "fortune" && wide.dir === "wide" && /말년/.test(pairLines(wide).join("")));
  const narrow = judgePairs(face({ foreheadFace: 80, jawCheek: 84 }), C);
  check("a narrow forehead over a wide jaw is told as early", narrow.kind === "fortune" && narrow.dir === "narrow" && /초년/.test(pairLines(narrow).join("")));
  check("two unlike eyes are told without inventing a result", (() => { const e = judgePairs(face({ eyeAsym: C.eyeAsym.center + 3 * C.eyeAsym.scale }), C); const t = pairLines(e).join(""); return e.kind === "eyes" && /두 눈/.test(t) && !/운이|운을|복이|재물|형제|말년|초년/.test(t); })());
  check("two unlike cheekbones are told without inventing a result", (() => { const e = judgePairs(face({ cheekAsym: 9 }), C); const t = pairLines(e).join(""); return e.kind === "cheeks" && /광대/.test(t) && !/운이|운을|복이|재물|형제|말년|초년/.test(t); })());
  check("only the most mismatched pair is told", judgePairs(face({ eyeAsym: C.eyeAsym.center + 5 * C.eyeAsym.scale, foreheadFace: 88, jawCheek: 78 }), C).kind === "eyes");
  check("no pair judgement without any measure", judgePairs({}, C) === null && pairLines(null).length === 0);
  check("brows and half stay out of the pairs", !["brow", "brows", "nose"].includes(judgePairs(face({ browLength: 1 }), C).kind));
  check("the pair sentences have no dash and no half-brother", !/[\u2014\u2013]|이복|異母/.test(["balanced", "eyes", "cheeks"].map((kind) => pairLines({ kind }).join("")).concat(pairLines({ kind: "fortune", dir: "wide" }), pairLines({ kind: "fortune", dir: "narrow" })).join("")));
  const partsContent = await (await fetch("../dist/parts.json")).json();
  const v = face({ foreheadFace: 92, jawCheek: 76 });
  const ps = readParts(v, partsContent);
  const story = composeStory(ps.all, null, extrasOf(v, ps.all, 30));
  check("the first page tells the pair after the frame", story.pages[0].body.some((l) => l.includes("마주 보는 짝")));
  void PAIR_RULES;
}

{

  check("gender reaches the prompt", /woman/.test(prompts[0]) && /man/.test(portraitPrompt({ pole: "drive+", kind: "fit", gender: "male" })));

  const m = { jawWidth: 1.1, faceRatio: 0.8, eyeGap: 0.3, a: 1, b: 2, hairUnknown: "x", nested: { z: 1 }, bad: NaN, confidence: 71.6, frames: 90 };
  const rec = buildRecord({ gender: "male", age: 30, measurement: m });
  check("the record has numbers only", rec && !("hairUnknown" in rec.values) && !("nested" in rec.values) && !("bad" in rec.values) && rec.values.jawWidth === 1.1);
  check("the record carries no picture or name field", Object.keys(rec).sort().join() === "age,appVersion,confidence,frames,gender,values");
  check("no record without a chosen gender or age", buildRecord({ gender: null, age: 30, measurement: m }) === null && buildRecord({ gender: "male", age: 60, measurement: m }) === null);
  const ageOf = (age) => portraitPrompt({ pole: "drive+", kind: "fit", gender: "female", age });

  check("an unknown age falls back to the 20s", /in their 20s/.test(ageOf(77)));
  check("spare picture path per kind of person", /fallback\/fit-drive%2B-female\.jpg$/.test(fallbackPath({ pole: "drive+", kind: "fit", gender: "female" })) && /clash-even-male\.jpg$/.test(fallbackPath({ pole: null, kind: "clash", gender: "male" })));
  check("no spare picture without a gender", fallbackPath({ pole: "drive+", kind: "fit", gender: "any" }) === null);
  check("no em dash in prompts", !prompts.some((t) => t.includes("\u2014")));
  check("face features show up as words", featureWords("drive+").length > 0 && /Face:/.test(prompts[0]));
}
