<!doctype html>
<meta charset="utf-8" />
<title>flow test</title>
<pre id="out">RUNNING</pre>
<iframe id="app" src="../dist/index.html?sim=1&resid=off&strict=0" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
import { estimatePose, canonicalPoints } from "../dist/pose.js";
import { LANDMARK } from "../dist/features.js";

const lines = [];
let failed = 0;
const check = (name, ok, detail = "") => { if (!ok) failed += 1; lines.push(`${ok ? "PASS" : "FAIL"} ${name}${detail ? "  " + detail : ""}`); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const frame = document.getElementById("app");
await new Promise((r) => frame.addEventListener("load", r));
for (let i = 0; i < 100 && !frame.contentWindow.__sangReady; i += 1) await sleep(50);
const win = frame.contentWindow;
const doc = frame.contentDocument;
check("simulation hook is ready", !!win.__sangReady);
// A visitor who picked a gender and the 20s (the app asks for both before measuring).
doc.querySelector('#genderPick .chip-btn[data-gender="male"]')?.click();
doc.querySelector('#agePick .chip-btn[data-age="20"]')?.click();
// Count the calls to the picture service: for the 20s there must be none.
const portraitCalls = [];
const realFetch = win.fetch.bind(win);
win.fetch = (url, ...rest) => { if (String(url).includes("/api/portrait")) portraitCalls.push(String(url)); return realFetch(url, ...rest); };
check("the statistics box starts unticked", doc.querySelector("#consentBox") && doc.querySelector("#consentBox").checked === false);

// ----- landmark arrays that look like MediaPipe output -----
const W = 1280;
const H = 720;
const base = canonicalPoints(14);
const rad = (d) => (d * Math.PI) / 180;
const yawR = (p, a) => ({ x: p.x * Math.cos(a) - p.z * Math.sin(a), y: p.y, z: p.x * Math.sin(a) + p.z * Math.cos(a) });
const pitchR = (p, a) => ({ x: p.x, y: p.y * Math.cos(a) + p.z * Math.sin(a), z: -p.y * Math.sin(a) + p.z * Math.cos(a) });
const rollR = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a), z: p.z });
let seed = 5;
const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function landmarksFor(points, yaw, pitch, roll, noise = 1) {
  const arr = Array.from({ length: 468 }, () => ({ x: 0.5, y: 0.5, z: 0 }));
  for (const [name, index] of Object.entries(LANDMARK)) {
    const p = points[name] ?? points.noseBase;
    const q = rollR(pitchR(yawR(p, rad(yaw)), rad(pitch)), rad(roll));
    arr[index] = { x: (q.x + 640 + (rng() - 0.5) * noise) / W, y: (q.y + 360 + (rng() - 0.5) * noise) / H, z: (q.z - 40 + (rng() - 0.5) * noise * 2) / W };
  }
  return arr;
}

// ----- a smiling and a turned-away frame are guided, not counted -----
win.__sang.feed(landmarksFor(base, 0, 0, 0), { mouthSmileLeft: 0.8, mouthSmileRight: 0.8 });
let st = win.__sang.state();
check("a smile is not counted and the visitor is told", st.frames === 0 && st.status.includes("무표정"), st.status);
win.__sang.feed(landmarksFor(base, 40, 0, 0));
st = win.__sang.state();
check("a large head turn is not counted", st.frames === 0 && st.status.includes("돌아와"), st.status);

// ----- the measuring screen is showing, as for a visitor -----
doc.querySelector("#emptyState").hidden = true;
doc.querySelector("#scanScreen").hidden = false;

// ----- natural movement until the capture finishes by itself -----
let frames = 0;
while (!win.__sang.state().comparing && !win.__sang.state().done && frames < 1200) {
  const t = frames / 18;
  win.__sang.feed(landmarksFor(base, 20 * Math.sin(t), 12 * Math.sin(t * 1.3 + 1), 5 * Math.sin(t * 0.6)));
  frames += 1;
}
check("after the relaxed capture the jaw-clench shot is asked for", win.__sang.state().comparing && win.__sang.state().status.includes("턱에 힘"), win.__sang.state().status);
// jaw clenched: the jaw points move outward a little, then a smile
const clenched = { ...base, jawLeft: { ...base.jawLeft, x: base.jawLeft.x - 4 }, jawRight: { ...base.jawRight, x: base.jawRight.x + 4 } };
for (let i = 0; i < 14; i += 1) win.__sang.feed(landmarksFor(clenched, 0, 0, 0));
check("then the smile shot is asked for", win.__sang.state().comparing && win.__sang.state().status.includes("웃어"), win.__sang.state().status);
const smiling = { ...base, mouthLeft: { ...base.mouthLeft, x: base.mouthLeft.x - 6, y: base.mouthLeft.y - 5 }, mouthRight: { ...base.mouthRight, x: base.mouthRight.x + 6, y: base.mouthRight.y - 5 } };
for (let i = 0; i < 14; i += 1) win.__sang.feed(landmarksFor(smiling, 0, 0, 0), { mouthSmileLeft: 0.6, mouthSmileRight: 0.6 });
st = win.__sang.state();
check("capture finishes by itself while the head keeps moving", st.done && st.finalMeasurement?.jawFlex > 2 && st.finalMeasurement?.smileLift > 2, `${frames} fed, ${st.finalMeasurement?.frames} used, jawFlex ${st.finalMeasurement?.jawFlex?.toFixed(2)}, smileLift ${st.finalMeasurement?.smileLift?.toFixed(2)}`);
check("the 풀이 보기 and 그만하기 buttons are not shown in the real flow", doc.querySelector("#scanActions").hidden);
check("the guide line sits over the camera picture", !!doc.querySelector("#cameraFrame #statusMessage"));
await sleep(2200);
check("the reading starts by itself after the capture", doc.querySelector("#scanScreen").hidden && (!doc.querySelector("#loadingScreen").hidden || !doc.querySelector("#resultView").hidden), "");
check("five themes and three frames are produced", st.reading?.themes.length === 5 && Object.keys(st.reading.frames.axes).length === 3);
check("measurement carries confidence and coverage", st.finalMeasurement.confidence > 40 && st.finalMeasurement.coverage.yaw[1] - st.finalMeasurement.coverage.yaw[0] > 10, `confidence ${st.finalMeasurement.confidence}`);
// (the canonical face is no longer the average: centres now come from real people)

// ----- the reading renders, page by page -----
win.__sang.show();
await sleep(200);
const text = (sel) => doc.querySelector(sel)?.textContent ?? "";
check("the story has nine pages: the frame, then the temperament, then the rest with the connectors", doc.querySelectorAll("#pages .slide").length === 9 && /^이 얼굴은|^이 사람은/.test(doc.querySelector("#storyFirst .story-lead")?.textContent ?? "") && [...doc.querySelectorAll("#pages .slide .story-lead")].some((e) => /^이 사람은/.test(e.textContent)) && [...doc.querySelectorAll("#pages .slide .story-lead")].some((e) => /^그래서 잘 맞는 인연은/.test(e.textContent)));
await sleep(400);
const bondImages = [...doc.querySelectorAll(".bond .avatar-photo")];
check("20s: the 인연 pictures are the ready-made ones and no picture service call is made", portraitCalls.length === 0 && bondImages.length > 0 && bondImages.every((i) => /\/fallback\/.+\.jpg/.test(i.src)), `calls ${portraitCalls.length}, images ${bondImages.map((i) => i.src.slice(-30)).join(",")}`);
check("every page says something and nothing is folded away", [...doc.querySelectorAll("#pages .slide")].every((s) => s.textContent.length > 40) && doc.querySelectorAll("#resultView details").length === 0);
{
  // the last page tells its lines about fortune one at a time, then shows the buttons
  const dots = doc.querySelectorAll("#slideDots button");
  dots[dots.length - 1].click();
  await sleep(1500);
  const shown = () => doc.querySelectorAll("#closingNotes .closing-note.is-shown").length;
  const early = shown();
  check("the closing lines come one at a time", early >= 1 && early < 4, `shown ${early}`);
  check("the buttons wait for the last line", !doc.querySelector(".fortune").classList.contains("is-done"));
  await sleep(8500);
  check("the buttons come with the last line", doc.querySelector(".fortune").classList.contains("is-done") === (shown() === 4));
  await sleep(5500);
  check("the picture steps aside on the fortune page", doc.querySelector(".reading").classList.contains("is-fortune"));
  check("all five lines and the quotation are shown, then the buttons", shown() === 4 && doc.querySelector(".fortune").classList.contains("is-done"));
}
check("the posed shots add their lines to the temperament page", /힘을 주면 각이|더 뚜렷|웃으면|절제된|달라지지 않습니다/.test(text("#pages .slide.is-story")), text("#pages .slide.is-story").slice(0, 160));
check("part names in the story can be pointed at, and each row has a gist line", doc.querySelectorAll("#pages .ink[data-part]").length >= 3 && doc.querySelectorAll("#pages .story-gist").length >= 3);
check("no placeholder text in the story", !/undefined|NaN|\{|보통 범위/.test(text("#pages")));
check("no NaN or undefined anywhere in the reading", !/NaN|undefined/.test(doc.querySelector("#resultView").textContent));
check("no em dash in the reading", !/[\u2014\u2013]/.test(doc.querySelector("#resultView").textContent));
check("no unfilled tokens in the cards", !/\{[a-z]/.test(doc.querySelector("#resultView").textContent));

lines.push(failed === 0 ? "ALL PASSED" : `${failed} FAILED`);
document.getElementById("out").textContent = lines.join("\n");
</script>
