<!doctype html>
<meta charset="utf-8" />
<title>flow test</title>
<pre id="out">RUNNING</pre>
<iframe id="app" src="../dist/index.html?sim=1&resid=off" style="width:1400px;height:900px;border:0"></iframe>
<script type="module">
import { estimatePose, canonicalPoints } from "../dist/pose.js";
import { LANDMARK } from "../dist/features.js";

const lines = [];
let failed = 0;
const check = (name, ok, detail = "") => { if (!ok) failed += 1; lines.push(`${ok ? "PASS" : "FAIL"} ${name}${detail ? "  " + detail : ""}`); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const frame = document.getElementById("app");
await new Promise((r) => frame.addEventListener("load", r));
for (let i = 0; i < 100 && !frame.contentWindow.__sangReady; i += 1) await sleep(50);
const win = frame.contentWindow;
const doc = frame.contentDocument;
check("simulation hook is ready", !!win.__sangReady);

// ----- landmark arrays that look like MediaPipe output -----
const W = 1280;
const H = 720;
const base = canonicalPoints(14);
const rad = (d) => (d * Math.PI) / 180;
const yawR = (p, a) => ({ x: p.x * Math.cos(a) - p.z * Math.sin(a), y: p.y, z: p.x * Math.sin(a) + p.z * Math.cos(a) });
const pitchR = (p, a) => ({ x: p.x, y: p.y * Math.cos(a) + p.z * Math.sin(a), z: -p.y * Math.sin(a) + p.z * Math.cos(a) });
const rollR = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a), z: p.z });
let seed = 5;
const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function landmarksFor(points, yaw, pitch, roll, noise = 1) {
  const arr = Array.from({ length: 468 }, () => ({ x: 0.5, y: 0.5, z: 0 }));
  for (const [name, index] of Object.entries(LANDMARK)) {
    const p = points[name] ?? points.noseBase;
    const q = rollR(pitchR(yawR(p, rad(yaw)), rad(pitch)), rad(roll));
    arr[index] = { x: (q.x + 640 + (rng() - 0.5) * noise) / W, y: (q.y + 360 + (rng() - 0.5) * noise) / H, z: (q.z - 40 + (rng() - 0.5) * noise * 2) / W };
  }
  return arr;
}

// ----- a smiling and a turned-away frame are guided, not counted -----
win.__sang.feed(landmarksFor(base, 0, 0, 0), { mouthSmileLeft: 0.8, mouthSmileRight: 0.8 });
let st = win.__sang.state();
check("a smile is not counted and the visitor is told", st.frames === 0 && st.status.includes("무표정"), st.status);
win.__sang.feed(landmarksFor(base, 40, 0, 0));
st = win.__sang.state();
check("a large head turn is not counted", st.frames === 0 && st.status.includes("돌아와"), st.status);

// ----- the measuring screen is showing, as for a visitor -----
doc.querySelector("#emptyState").hidden = true;
doc.querySelector("#scanScreen").hidden = false;

// ----- natural movement until the capture finishes by itself -----
let frames = 0;
while (!win.__sang.state().done && frames < 1200) {
  const t = frames / 18;
  win.__sang.feed(landmarksFor(base, 20 * Math.sin(t), 12 * Math.sin(t * 1.3 + 1), 5 * Math.sin(t * 0.6)));
  frames += 1;
}
st = win.__sang.state();
check("capture finishes by itself while the head keeps moving", st.done, `${frames} fed, ${st.finalMeasurement?.frames} used`);
await sleep(1500);
check("finishing the capture does not open the reading by itself", !doc.querySelector("#scanScreen").hidden && doc.querySelector("#loadingScreen").hidden && doc.querySelector("#resultView").hidden);
check("a 풀이 보기 button appears instead", !doc.querySelector("#toResultButton").hidden);
// frames keep coming in after the capture is complete (debug recording keeps going)
win.__sang.feed(landmarksFor(base, 5, 0, 0));
check("the camera keeps being read after completion", doc.querySelector("#resultView").hidden);
check("five themes and three frames are produced", st.reading?.themes.length === 5 && Object.keys(st.reading.frames.axes).length === 3);
check("measurement carries confidence and coverage", st.finalMeasurement.confidence > 40 && st.finalMeasurement.coverage.yaw[1] - st.finalMeasurement.coverage.yaw[0] > 10, `confidence ${st.finalMeasurement.confidence}`);
// (the canonical face is no longer the average: centres now come from real people)

// ----- the reading renders, page by page -----
win.__sang.show();
await sleep(200);
const text = (sel) => doc.querySelector(sel)?.textContent ?? "";
check("an overall reading is written for the top three", doc.querySelectorAll("#synthesis p").length >= 2);
check("every card starts with a summary", [...doc.querySelectorAll(".part-card")].every((c) => (c.querySelector(".part-summary")?.textContent ?? "").length > 20));
check("three most distinctive parts first", doc.querySelectorAll("#topCards .part-card").length === 3 && doc.querySelectorAll("#topList li").length === 3);
check("every measured part has a card", doc.querySelectorAll(".part-card").length >= 24, `${doc.querySelectorAll(".part-card").length} cards`);
check("a face shape is named", doc.querySelectorAll("#shapeBox .shape-name").length === 1 && doc.querySelectorAll("#shapeBox .shape-icon.is-on").length === 1, doc.querySelector("#shapeBox .shape-name")?.textContent);
check("eyes, brows, nose, mouth, forehead and jaw each get one card", doc.querySelectorAll("#groupCards .group-card").length === 6, [...doc.querySelectorAll("#groupCards .group-head h3")].map((e) => e.textContent).join(" "));
check("each card says what was measured on this face", [...doc.querySelectorAll(".part-card")].every((c) => /\d/.test(c.querySelector(".part-row.is-mine")?.textContent ?? "")));
check("closing line is filled", text("#resultClosing").length > 10);
check("no placeholder text in the overall reading", !/undefined|NaN|\{/.test(text("#synthesis")));
check("no NaN or undefined anywhere in the reading", !/NaN|undefined/.test(doc.querySelector("#resultView").textContent));
check("no em dash in the reading", !/[\u2014\u2013]/.test(doc.querySelector("#resultView").textContent));
check("no unfilled tokens in the cards", !/\{[a-z]/.test(doc.querySelector("#resultView").textContent));

lines.push(failed === 0 ? "ALL PASSED" : `${failed} FAILED`);
document.getElementById("out").textContent = lines.join("\n");
</script>
